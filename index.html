<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعهد وتسليم تكليف التطبيقات التقنية - ألاء النيل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .info {
            background: #eef2f3;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: right;
            font-size: 16px;
            line-height: 1.6;
        }
        .info span {
            font-weight: bold;
            color: #2980b9;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>تكليف مادة التطبيقات التقنية</h1>
        <p>إشراف د. مها زغلول</p>

        <div class="info">
            <p><span>اسم الطالبة:</span> ألاء محمد علي محمد النيل</p>
            <p><span>الرقم الجامعي:</span> 2502411</p>
            <p><span>المعهد:</span> المعهد العالي للعلوم الإدارية والحاسب الآلي بالمنصورة</p>
        </div>

        <div>
            <h3>صورة التكليف:</h3>
            <img src="ai-programming.jpg" alt="صورة توضيحية للبرمجة والذكاء الاصطناعي">
        </div>

        <div class="footer">
            <p>تم رفع هذا الملف وإدارته عبر نظام GitHub ضمن متطلبات المادة.</p>
        </div>
    </div>

</body>
</html>
